[project]
name = "paperless-edoc"
version = "0.1.0"
description = "Third-party parser for ETSI ASiC-E signed documents (EU e-signed docs: .edoc, .asice, .bdoc, .adoc) for Paperless-ngx"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Exerra" }]
keywords = ["paperless-ngx", "parser", "edoc", "asice", "xades", "signature"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.entry-points."paperless_ngx.parsers"]
edoc = "paperless_edoc.parser:EdocDocumentParser"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_edoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
DJANGO_SETTINGS_MODULE = "test_settings"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
lint.select = ["E4", "E7", "E9", "F"]
lint.extend-select = [
  "COM",
  "EXE",
  "FBT",
  "FLY",
  "G201",
  "I",
  "ICN",
  "INP",
  "ISC",
  "PIE",
  "PLC",
  "PLE",
  "PTH",
  "Q",
  "RSE",
  "RUF",
  "SIM",
  "T20",
  "TC",
  "TID",
  "UP",
  "W",
]
lint.ignore = [
  "PLC0415",
  "SIM105",
]
lint.per-file-ignores."*/tests/*.py" = ["E501", "SIM117"]
